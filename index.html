<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Abdelaziz Ibrahim</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
        <style>
            :root {
                --bg-color: #ffffff;
                --text-color: #333333;
                --accent-color: #f0f0f0;
                --hover-color: #e0e0e0;
            }

            [data-theme="dark"] {
                --bg-color: #1a1a1a;
                --text-color: #f5f5f5;
                --accent-color: #2a2a2a;
                --hover-color: #3a3a3a;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                transition: all 0.3s ease;
            }

            body {
                font-family: "Roboto", sans-serif;
                background-color: var(--bg-color);
                color: var(--text-color);
                line-height: 1.6;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 2rem;
                text-align: center;
            }

            .container {
                max-width: 600px;
                margin: 0 auto;
            }

            .profile-image {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                object-fit: cover;
                margin-bottom: 1rem;
            }

            h1 {
                font-size: 2.2rem;
                margin-bottom: 0.5rem;
            }

            h2 {
                font-size: 1.2rem;
                font-weight: 300;
                margin-bottom: 1.5rem;
                opacity: 0.8;
            }

            .links {
                display: flex;
                justify-content: center;
                gap: 1.5rem;
                margin: 2rem 0;
            }

            .links a {
                color: var(--text-color);
                font-size: 1.2rem;
                text-decoration: none;
                padding: 0.5rem 1rem;
                border-radius: 5px;
                transition: all 0.2s ease;
            }

            .links a:hover {
                background-color: var(--hover-color);
            }

            .cv-link {
                margin-top: 1rem;
                display: inline-block;
                padding: 0.7rem 1.5rem;
                background-color: var(--accent-color);
                color: var(--text-color);
                text-decoration: none;
                border-radius: 5px;
                transition: all 0.2s ease;
            }

            .cv-link:hover {
                background-color: var(--hover-color);
                transform: translateY(-2px);
            }

            .theme-toggle {
                background: none;
                border: none;
                color: var(--text-color);
                font-size: 1.2rem;
                cursor: pointer;
                position: absolute;
                top: 20px;
                right: 20px;
            }

            .easter-egg {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 30px;
                height: 30px;
                background-color: var(--accent-color);
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                z-index: 1000;
            }

            .turing-test {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.9);
                display: none;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 2000;
                color: white;
                padding: 1rem;
            }

            .dialog {
                max-width: 600px;
                text-align: left;
                font-family: monospace;
                background: rgba(30, 30, 30, 0.7);
                padding: 1.5rem;
                border-radius: 5px;
                position: relative;
            }

            .close-dialog {
                position: absolute;
                top: 10px;
                right: 10px;
                color: white;
                font-size: 1.5rem;
                cursor: pointer;
            }

            .question {
                margin-bottom: 1rem;
            }

            .quote {
                font-style: italic;
                margin-top: 2rem;
                max-width: 500px;
            }
        </style>
    </head>

    <body>
        <button class="theme-toggle" id="theme-toggle">
            <i class="fas fa-adjust"></i>
        </button>

        <div class="container">
            <img
                src="https://github.com/Ibraziz.png"
                alt="Abdelaziz Ibrahim"
                class="profile-image"
            />
            <h1>Abdelaziz Ibrahim</h1>
            <h2>AI Engineer</h2>

            <div class="links">
                <a href="https://github.com/Ibraziz" target="_blank"
                    ><i class="fab fa-github"></i> GitHub</a
                >
                <a href="https://www.linkedin.com/in/abdelaziz-ibrahim-740800172/" target="_blank"
                    ><i class="fab fa-linkedin"></i> LinkedIn</a
                >
            </div>

            <a href="/cv.html" class="cv-link">View my CV</a>
        </div>


        <script>
            const themeToggle = document.getElementById("theme-toggle");
            const body = document.body;

            // Set initial theme based on OS preference
            if (
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
                body.dataset.theme = "dark";
            } else {
                body.dataset.theme = "light";
            }

            themeToggle.addEventListener("click", () => {
                body.dataset.theme =
                    body.dataset.theme === "dark" ? "light" : "dark";
            });

        </script>
    </body>
</html>
